# appkit-notify-pro: INTERNAL personal chain. Its secrets and network access
# deliberately make it ineligible for the public expose seam.
name: appkit-notify-pro
repo: themartianapp/appkit-demo
description: Sends the persistent personal appkit-pro launch kit to the operator.
env_file: /root/.config/gitmoot/appkit-notify.env
trigger:
  kind: pipeline
  pipeline: appkit-pro
stages:
  - id: notify
    cmd: sh tools/notify_pro.sh
    env_keys: [TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID]
    timeout: 5m
